<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModSubThai - Steam Showcase (THB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d121d;
            color: #94a3b8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .game-card {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            transition: all 0.25s ease-in-out;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-500/20">
                    TH
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">ModSubThai <span class="text-blue-400">Showcase</span></h1>
                    <p class="text-xs text-slate-400">อัปเดตราคาหน้าร้าน Steam โซนไทย (THB) 🇹🇭</p>
                </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="filterGames()" placeholder="ค้นหาชื่อเกม..." 
                           class="bg-slate-950 border border-slate-700 text-white text-xs rounded-xl pl-8 pr-4 py-2 w-48 sm:w-64 focus:outline-none focus:border-blue-500 transition">
                    <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button onclick="fetchPricesBatch(true)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium shadow-sm">
                    <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    รีเฟรชราคา
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-1">
        <div class="flex items-center justify-between mb-6 flex-wrap gap-2 text-xs">
            <div class="flex items-center gap-2">
                <span id="statusIndicator" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="loadStatus" class="text-slate-400">กำลังตรวจสอบข้อมูลราคา...</span>
            </div>
            <div class="text-slate-400">
                รวมทั้งหมด <span id="gameCount" class="text-white font-bold">0</span> เกม
            </div>
        </div>

        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        ModSubThai Steam Showcase • ข้อมูลราคาดึงตรงจาก Steam Store API (Thailand Region)
    </footer>

    <script>
        const GAME_LIST = [
            { id: 582010, title: "Monster Hunter: World", modUrl: "#" },
            { id: 1091500, title: "Cyberpunk 2077", modUrl: "#" },
            { id: 292030, title: "The Witcher 3: Wild Hunt", modUrl: "#" },
            { id: 1151640, title: "Horizon Zero Dawn", modUrl: "#" },
            { id: 814380, title: "Sekiro: Shadows Die Twice", modUrl: "#" },
            { id: 1817070, title: "Marvel’s Spider-Man Remastered", modUrl: "#" },
            { id: 413150, title: "Stardew Valley", modUrl: "#" },
            { id: 1245620, title: "ELDEN RING", modUrl: "#" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderBaseCards();
            fetchPricesBatch();
        });

        function renderBaseCards() {
            const grid = document.getElementById("gamesGrid");
            document.getElementById("gameCount").innerText = GAME_LIST.length;

            grid.innerHTML = GAME_LIST.map(game => `
                <div id="card-${game.id}" class="game-card rounded-2xl overflow-hidden flex flex-col justify-between" data-title="${game.title.toLowerCase()}">
                    <div>
                        <div class="relative overflow-hidden aspect-[460/215] bg-slate-950">
                            <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${game.id}/header.jpg" 
                                 alt="${game.title}" 
                                 class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                                 loading="lazy">
                        </div>
                        <div class="p-4">
                            <h3 class="text-sm font-semibold text-white truncate" title="${game.title}">${game.title}</h3>
                            <p class="text-[11px] text-slate-500 font-mono mt-0.5">AppID: ${game.id}</p>
                        </div>
                    </div>

                    <div class="p-4 pt-0 border-t border-slate-800/80 mt-2">
                        <div id="price-box-${game.id}" class="flex items-center justify-between py-2 min-h-[44px]">
                            <span class="text-xs text-slate-500 animate-pulse">กำลังโหลดราคา...</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <a href="https://store.steampowered.com/app/${game.id}" target="_blank" 
                               class="text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition border border-slate-700">
                                ร้านค้า Steam
                            </a>
                            <a href="${game.modUrl}" 
                               class="text-center py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition shadow-md shadow-blue-600/20">
                                ดาวน์โหลดม็อด
                            </a>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        // ฟังก์ชันช่วย fetch พร้อมตั้งเวลา Timeout ไม่ให้ค้าง
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, {
                ...options,
                signal: controller.signal
            });
            clearTimeout(id);
            return response;
        }

        // ดึงราคาแบบ Batch รวมกันรอบเดียว
        async function fetchPricesBatch(forceRefresh = false) {
            const statusEl = document.getElementById("loadStatus");
            const indicatorEl = document.getElementById("statusIndicator");
            const refreshIcon = document.getElementById("refreshIcon");

            refreshIcon.classList.add("animate-spin");
            indicatorEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            statusEl.innerText = "กำลังดึงราคาโซนไทย (THB)...";

            const missingAppIds = [];
            const cacheKey = "steam_prices_th";
            let cachedData = {};

            try {
                const saved = localStorage.getItem(cacheKey);
                if (saved) cachedData = JSON.parse(saved);
            } catch (e) {
                cachedData = {};
            }

            const now = Date.now();
            GAME_LIST.forEach(game => {
                const item = cachedData[game.id];
                if (!forceRefresh && item && (now - item.time < 30 * 60 * 1000)) {
                    renderPrice(game.id, item.data);
                } else {
                    missingAppIds.push(game.id);
                }
            });

            if (missingAppIds.length === 0) {
                finishLoading();
                return;
            }

            const appidsParam = missingAppIds.join(",");
            const targetUrl = `https://store.steampowered.com/api/appdetails?appids=${appidsParam}&cc=th&l=thai&filters=price_overview`;

            // รายการ Proxy สำหรับสลับใช้เมื่อตัวใดตัวหนึ่งล่มหรือค้าง
            const proxies = [
                (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`
            ];

            let fetchSuccess = false;

            for (const getProxyUrl of proxies) {
                try {
                    const proxyEndpoint = getProxyUrl(targetUrl);
                    const res = await fetchWithTimeout(proxyEndpoint, { timeout: 6000 });
                    if (!res.ok) continue;

                    let rawData;
                    if (proxyEndpoint.includes("allorigins")) {
                        const json = await res.json();
                        rawData = JSON.parse(json.contents);
                    } else {
                        rawData = await res.json();
                    }

                    if (rawData && typeof rawData === "object") {
                        missingAppIds.forEach(id => {
                            const appInfo = rawData[id];
                            let priceData = null;

                            if (appInfo && appInfo.success) {
                                const overview = appInfo.data.price_overview;
                                if (!overview) {
                                    priceData = { isFree: true };
                                } else {
                                    priceData = {
                                        isFree: false,
                                        currency: overview.currency,
                                        initial: overview.initial_formatted,
                                        final: overview.final_formatted,
                                        discount: overview.discount_percent
                                    };
                                }
                            }

                            cachedData[id] = { time: now, data: priceData };
                            renderPrice(id, priceData);
                        });

                        localStorage.setItem(cacheKey, JSON.stringify(cachedData));
                        fetchSuccess = true;
                        break;
                    }
                } catch (err) {
                    console.warn("Proxy ล้มเหลว กำลังลองวิธีสำรอง...", err);
                }
            }

            if (!fetchSuccess) {
                // ถ้า Proxy ทุกตัวไม่ตอบสนอง ให้เปลี่ยนสถานะไม่ให้ค้างคำว่ากำลังโหลด
                missingAppIds.forEach(id => renderPrice(id, null));
                indicatorEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-rose-500";
                statusEl.innerText = "ไม่สามารถเชื่อมต่อ Steam ได้ชั่วคราว (คลิกดูราคาที่ปุ่มร้านค้า)";
            } else {
                finishLoading();
            }

            refreshIcon.classList.remove("animate-spin");
        }

        function finishLoading() {
            const statusEl = document.getElementById("loadStatus");
            const indicatorEl = document.getElementById("statusIndicator");
            indicatorEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500";
            statusEl.innerText = "อัปเดตราคาไทยล่าสุดเรียบร้อยแล้วค่ะ";
        }

        function renderPrice(appId, price) {
            const box = document.getElementById(`price-box-${appId}`);
            if (!box) return;

            if (!price) {
                box.innerHTML = `<span class="text-xs text-slate-400">เช็คราคาที่ร้านค้า</span>`;
                return;
            }

            if (price.isFree) {
                box.innerHTML = `
                    <span class="inline-block px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-md">
                        เล่นฟรี (Free)
                    </span>
                `;
                return;
            }

            if (price.discount > 0) {
                box.innerHTML = `
                    <div class="flex items-center gap-1.5">
                        <span class="bg-emerald-500 text-slate-950 font-black text-xs px-1.5 py-0.5 rounded">
                            -${price.discount}%
                        </span>
                        <div class="flex flex-col">
                            <span class="text-[11px] text-slate-500 line-through leading-none">${price.initial}</span>
                            <span class="text-sm font-bold text-emerald-400 leading-tight">${price.final}</span>
                        </div>
                    </div>
                `;
            } else {
                box.innerHTML = `<span class="text-sm font-bold text-white">${price.final}</span>`;
            }
        }

        function filterGames() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            const cards = document.querySelectorAll(".game-card");
            let count = 0;

            cards.forEach(card => {
                const title = card.getAttribute("data-title");
                if (title.includes(query)) {
                    card.style.display = "flex";
                    count++;
                } else {
                    card.style.display = "none";
                }
            });

            document.getElementById("gameCount").innerText = count;
        }
    </script>
</body>
</html>
